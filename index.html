<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>NOQ 사무실 스케줄러</title>

    <link
        href="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css"
        rel="stylesheet"
    >

    <script
        src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js"
    ></script>

    <style>
        :root {
            --primary: #1c1c1e;
            --bg: #f2f2f7;
            --now-line: #ff3b30;
            --reservation: #b03a2e;
        }

        body {
            font-family: -apple-system, system-ui, sans-serif;
            margin: 0;
            background: var(--bg);
            color: #1c1c1e;
            line-height: 1.5;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
            padding: 12px;
            box-sizing: border-box;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 18px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.07);
            margin-bottom: 12px;
        }

        h2 {
            font-size: 1.4rem;
            margin: 0 0 20px 0;
            text-align: center;
            font-weight: 800;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .input-row {
            display: flex;
            gap: 10px;
            width: 100%;
            align-items: flex-end;
            flex-wrap: wrap;
        }

        .input-row > div {
            flex: 1;
            min-width: 150px;
        }

        input,
        select,
        button {
            padding: 14px;
            border-radius: 12px;
            border: 1px solid #d1d1d6;
            font-size: 17px;
            outline: none;
            width: 100%;
            box-sizing: border-box;
            background: white;
        }

        .time-label {
            font-size: 15px;
            color: #1c1c1e;
            margin-bottom: 8px;
            display: block;
            padding-left: 4px;
            font-weight: 800;
        }

        button#save-btn {
            background: var(--primary);
            color: white;
            border: none;
            font-weight: 700;
            cursor: pointer;
            padding: 16px;
            font-size: 18px;
            margin-top: 10px;
        }

        button#save-btn:active {
            opacity: 0.7;
        }

        /* 통계 */

        #stats-board {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 15px;
            background: #fff;
            border-radius: 18px;
            margin-bottom: 12px;
            border: 1px solid #e5e5ea;
        }

        #stats-title {
            font-size: 13px;
            font-weight: 800;
            color: #8e8e93;
            text-align: center;
        }

        #stats-content {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            font-weight: 700;
            background: #f8f8fa;
            padding: 6px 12px;
            border-radius: 20px;
        }

        .stat-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        /* 캘린더 */

        .fc-toolbar-chunk {
            display: flex !important;
            align-items: center !important;
            gap: 6px !important;
        }

        .fc-button {
            height: 44px !important;
            padding: 0 14px !important;
            font-size: 15px !important;
            font-weight: 700 !important;
            border-radius: 10px !important;
        }

        .fc-button-primary {
            background-color: #1c1c1e !important;
            border-color: #1c1c1e !important;
        }

        .fc-button-primary:disabled {
            background-color: #8e8e93 !important;
            border-color: #8e8e93 !important;
        }

        .fc-toolbar-title {
            font-size: 1.1rem !important;
            font-weight: 800 !important;
        }

        #calendar-container {
            overflow-x: auto;
            background: white;
            border-radius: 18px;
            min-height: 700px;
            -webkit-overflow-scrolling: touch;
        }

        #calendar {
            min-width: 850px;
        }

        .fc-event {
            cursor: pointer;
            border: none !important;
            border-radius: 8px !important;
        }

        .fc-v-event .fc-event-main {
            padding: 10px !important;
        }

        .fc-list-event-time {
            font-size: 15px !important;
            font-weight: 600 !important;
            color: #48484a !important;
        }

        /* 현재 시간 */

        .fc .fc-timegrid-now-indicator-line {
            border-color: var(--now-line) !important;
            border-width: 3px !important;
            z-index: 100;
        }

        .fc .fc-timegrid-now-indicator-arrow {
            border-color: var(--now-line) !important;
            border-width: 6px !important;
            margin-top: -5px !important;
        }

        /* 일정 선택 팝업 */

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.45);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            padding: 20px;
            box-sizing: border-box;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal-box {
            width: 100%;
            max-width: 360px;
            background: white;
            border-radius: 20px;
            padding: 24px;
            box-sizing: border-box;
            box-shadow: 0 10px 40px rgba(0,0,0,0.25);
        }

        .modal-title {
            font-size: 20px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .modal-message {
            color: #636366;
            font-size: 15px;
            margin-bottom: 20px;
            word-break: break-word;
        }

        .modal-buttons {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .modal-buttons button {
            border: none;
            font-weight: 700;
            cursor: pointer;
        }

        #modal-edit-btn {
            background: #1c1c1e;
            color: white;
        }

        #modal-delete-btn {
            background: #ff3b30;
            color: white;
        }

        #modal-cancel-btn {
            background: #e5e5ea;
            color: #1c1c1e;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <h2>🗓️ NOQ 사무실 스케줄러</h2>

        <div class="input-group">

            <div class="input-row">
                <div>
                    <span class="time-label">구분</span>

                    <select
                        id="category"
                        onchange="updateFormByCategory()"
                    >
                        <option value="attendance">
                            👤 구성원 출근
                        </option>

                        <option value="reservation">
                            🏠 공용 공간 예약
                        </option>
                    </select>
                </div>
            </div>

            <!-- 구성원 출근 -->

            <div
                class="input-row"
                id="attendance-fields"
            >
                <div>
                    <span class="time-label">구성원</span>

                    <select id="member">
                        <option value="남기">🔵 남기</option>
                        <option value="태건">🟢 태건</option>
                        <option value="해인">🟡 해인</option>
                        <option value="형대">🟣 형대</option>
                        <option value="예진">🟠 예진</option>
                    </select>
                </div>

                <div>
                    <span class="time-label">출근 유형</span>

                    <select id="work-type">
                        <option value="사무실">🏢 사무실</option>
                        <option value="재택">🏠 재택</option>
                        <option value="외근">🚗 외근</option>
                        <option value="공연">🎭 공연</option>
                    </select>
                </div>
            </div>

            <!-- 공용 공간 예약 -->

            <div
                class="input-row"
                id="reservation-fields"
                style="display:none;"
            >
                <div>
                    <span class="time-label">예약명</span>

                    <input
                        type="text"
                        id="reservation-title"
                        placeholder="예: 회의, 미팅, 외부 손님"
                    >
                </div>
            </div>

            <!-- 시작 일시 -->

            <div class="input-row">
                <div style="flex:2;">

                    <span class="time-label">시작 일시</span>

                    <div style="display:flex; gap:6px;">

                        <input
                            type="date"
                            id="start-date"
                            style="flex:1.5;"
                        >

                        <select
                            id="start-hour"
                            style="flex:1;"
                        ></select>

                        <select
                            id="start-min"
                            style="flex:1;"
                        ></select>

                    </div>
                </div>
            </div>

            <!-- 종료 일시 -->

            <div class="input-row">
                <div style="flex:2;">

                    <span class="time-label">종료 일시</span>

                    <div style="display:flex; gap:6px;">

                        <input
                            type="date"
                            id="end-date"
                            style="flex:1.5;"
                        >

                        <select
                            id="end-hour"
                            style="flex:1;"
                        ></select>

                        <select
                            id="end-min"
                            style="flex:1;"
                        ></select>

                    </div>
                </div>
            </div>

            <button
                id="save-btn"
                onclick="saveEvent()"
            >
                일정 등록하기
            </button>

        </div>
    </div>

    <!-- 통계 -->

    <div id="stats-board">
        <div id="stats-title">
            사용 기록 로딩 중...
        </div>

        <div id="stats-content">
            데이터를 불러오는 중...
        </div>
    </div>

    <!-- 캘린더 -->

    <div
        id="calendar-container"
        class="card"
    >
        <div id="calendar"></div>
    </div>

</div>

<!-- 일정 선택 팝업 -->

<div
    id="event-modal"
    class="modal-overlay"
>
    <div class="modal-box">

        <div
            class="modal-title"
            id="modal-title"
        >
            일정
        </div>

        <div
            class="modal-message"
            id="modal-message"
        ></div>

        <div class="modal-buttons">

            <button id="modal-edit-btn">
                수정하기
            </button>

            <button id="modal-delete-btn">
                삭제하기
            </button>

            <button id="modal-cancel-btn">
                취소
            </button>

        </div>

    </div>
</div>

<script>

const API_URL =
    "https://sheetdb.io/api/v1/xldk72yva40nn";

let calendar;
let editingEventId = null;
let selectedEvent = null;


/* 구성원 색상 */

const MEMBER_COLORS = {
    "남기": "#007aff",
    "태건": "#34c759",
    "해인": "#ffcc00",
    "형대": "#5856d6",
    "예진": "#ff9500"
};


/* 공용 공간 예약 */

const RESERVATION_COLOR =
    "#b03a2e";


const COLOR_MAP = {
    "#007aff": "남기",
    "#34c759": "태건",
    "#ffcc00": "해인",
    "#5856d6": "형대",
    "#ff9500": "예진",
    "#b03a2e": "공용 공간 예약"
};


const SORT_ORDER = [
    "#007aff",
    "#34c759",
    "#ffcc00",
    "#5856d6",
    "#ff9500",
    "#b03a2e"
];


/* 한국 시간 기준 오늘 날짜 */

function getKoreaToday() {

    const now = new Date();

    const koreaTime =
        new Date(
            now.toLocaleString(
                "en-US",
                {
                    timeZone: "Asia/Seoul"
                }
            )
        );

    const year =
        koreaTime.getFullYear();

    const month =
        String(
            koreaTime.getMonth() + 1
        ).padStart(2, "0");

    const day =
        String(
            koreaTime.getDate()
        ).padStart(2, "0");

    return `${year}-${month}-${day}`;
}


/* 시작 */

document.addEventListener(
    "DOMContentLoaded",
    function() {

        const hours =
            Array.from(
                { length: 24 },
                (_, i) =>
                    i.toString()
                    .padStart(2, "0")
            );


        const mins =
            Array.from(
                { length: 12 },
                (_, i) =>
                    (i * 5)
                    .toString()
                    .padStart(2, "0")
            );


        const hourSelects = [
            document.getElementById("start-hour"),
            document.getElementById("end-hour")
        ];


        const minSelects = [
            document.getElementById("start-min"),
            document.getElementById("end-min")
        ];


        hourSelects.forEach(select => {

            hours.forEach(hour => {

                select.add(
                    new Option(
                        hour + "시",
                        hour
                    )
                );

            });

        });


        minSelects.forEach(select => {

            mins.forEach(min => {

                select.add(
                    new Option(
                        min + "분",
                        min
                    )
                );

            });

        });


        const today =
            getKoreaToday();


        document.getElementById(
            "start-date"
        ).value = today;


        document.getElementById(
            "end-date"
        ).value = today;


        updateFormByCategory();

        initCalendar();

        initModal();

    }
);


/* 구분 변경 */

function updateFormByCategory() {

    const category =
        document.getElementById(
            "category"
        ).value;


    const attendanceFields =
        document.getElementById(
            "attendance-fields"
        );


    const reservationFields =
        document.getElementById(
            "reservation-fields"
        );


    if (
        category === "attendance"
    ) {

        attendanceFields.style.display =
            "flex";

        reservationFields.style.display =
            "none";

    }

    else {

        attendanceFields.style.display =
            "none";

        reservationFields.style.display =
            "flex";

    }

}


/* 캘린더 */

function initCalendar() {

    const calendarEl =
        document.getElementById(
            "calendar"
        );


    calendar =
        new FullCalendar.Calendar(
            calendarEl,
            {

                initialView:
                    "timeGridWeek",

                locale:
                    "ko",

                firstDay:
                    1,

                slotMinTime:
                    "00:00:00",

                slotMaxTime:
                    "24:00:00",

                scrollTime:
                    "09:00:00",

                contentHeight:
                    700,

                nowIndicator:
                    true,

                allDaySlot:
                    false,

                eventTimeFormat: {
                    hour: "2-digit",
                    minute: "2-digit",
                    hour12: false
                },

                headerToolbar: {
                    left: "prev,next today",
                    center: "title",
                    right: "dayGridMonth,timeGridWeek,listWeek"
                },

                eventSources: [
                    {
                        url: API_URL,

                        success:
                            content =>
                                content.map(
                                    item => ({
                                        id: item.id,
                                        title: item.title,
                                        start: item.start,
                                        end: item.end,
                                        color: item.color
                                    })
                                )
                    }
                ],

                datesSet:
                    info =>
                        setTimeout(
                            () =>
                                updateStats(info),
                            500
                        ),

                eventClick:
                    info => {

                        selectedEvent =
                            info.event;

                        openEventModal(
                            info.event
                        );

                    },

                eventContent:
                    arg => {

                        if (
                            arg.view.type ===
                            "listWeek"
                        ) {

                            const t =
                                document.createElement(
                                    "div"
                                );

                            t.innerText =
                                arg.event.title;

                            t.style.fontSize =
                                "17px";

                            t.style.fontWeight =
                                "800";

                            return {
                                domNodes: [t]
                            };

                        }


                        const wrapper =
                            document.createElement(
                                "div"
                            );

                        wrapper.style.display =
                            "flex";

                        wrapper.style.flexDirection =
                            "column";


                        if (
                            arg.view.type ===
                            "dayGridMonth"
                        ) {

                            wrapper.style.flexDirection =
                                "row";

                            wrapper.style.alignItems =
                                "center";


                            const dot =
                                document.createElement(
                                    "div"
                                );

                            dot.style.cssText =
                                `width:8px;
                                height:8px;
                                border-radius:50%;
                                background:${arg.event.backgroundColor};
                                margin-right:5px;`;

                            wrapper.appendChild(dot);

                        }


                        const content =
                            document.createElement(
                                "div"
                            );


                        if (
                            arg.view.type ===
                            "timeGridWeek"
                        ) {

                            content.innerHTML =
                                `<div style="
                                    font-size:14px;
                                    opacity:0.8;
                                ">
                                    ${arg.timeText}
                                </div>

                                <div style="
                                    font-weight:800;
                                    font-size:17px;
                                ">
                                    ${arg.event.title}
                                </div>`;

                        }

                        else {

                            content.innerText =
                                arg.event.title;

                            content.style.fontWeight =
                                "800";

                        }


                        wrapper.appendChild(
                            content
                        );


                        return {
                            domNodes: [wrapper]
                        };

                    }

            }
        );


    calendar.render();

}


/* 팝업 */

function initModal() {

    const modal =
        document.getElementById(
            "event-modal"
        );


    document.getElementById(
        "modal-edit-btn"
    ).onclick =
        () => {

            if (selectedEvent) {

                loadEventForEdit(
                    selectedEvent
                );

            }

            closeEventModal();

        };


    document.getElementById(
        "modal-delete-btn"
    ).onclick =
        async () => {

            if (selectedEvent) {

                const eventId =
                    selectedEvent.id;

                closeEventModal();


                if (
                    confirm(
                        "정말 이 일정을 삭제하시겠습니까?"
                    )
                ) {

                    await deleteEventById(
                        eventId
                    );

                }

            }

        };


    document.getElementById(
        "modal-cancel-btn"
    ).onclick =
        () =>
            closeEventModal();


    modal.addEventListener(
        "click",
        event => {

            if (
                event.target === modal
            ) {

                closeEventModal();

            }

        }
    );

}


function openEventModal(event) {

    document.getElementById(
        "modal-title"
    ).innerText =
        event.title;


    document.getElementById(
        "modal-message"
    ).innerText =
        "원하는 작업을 선택하세요.";


    document.getElementById(
        "event-modal"
    ).classList.add(
        "show"
    );

}


function closeEventModal() {

    document.getElementById(
        "event-modal"
    ).classList.remove(
        "show"
    );

    selectedEvent = null;

}


/* 수정 모드 */

function loadEventForEdit(event) {

    editingEventId =
        event.id;


    const start =
        event.start;

    const end =
        event.end;


    const color =
        event.backgroundColor ||
        event.color;


    const member =
        Object.keys(
            MEMBER_COLORS
        ).find(
            name =>
                MEMBER_COLORS[name] ===
                color
        );


    if (member) {

        document.getElementById(
            "category"
        ).value =
            "attendance";


        updateFormByCategory();


        document.getElementById(
            "member"
        ).value =
            member;


        const workType =
            event.title
                .replace(
                    member,
                    ""
                )
                .trim();


        if (
            [
                "사무실",
                "재택",
                "외근",
                "공연"
            ].includes(workType)
        ) {

            document.getElementById(
                "work-type"
            ).value =
                workType;

        }

    }

    else {

        document.getElementById(
            "category"
        ).value =
            "reservation";


        updateFormByCategory();


        document.getElementById(
            "reservation-title"
        ).value =
            event.title;

    }


    document.getElementById(
        "start-date"
    ).value =
        formatDateInput(start);


    document.getElementById(
        "end-date"
    ).value =
        formatDateInput(end);


    document.getElementById(
        "start-hour"
    ).value =
        String(
            start.getHours()
        ).padStart(2, "0");


    document.getElementById(
        "start-min"
    ).value =
        String(
            start.getMinutes()
        ).padStart(2, "0");


    document.getElementById(
        "end-hour"
    ).value =
        String(
            end.getHours()
        ).padStart(2, "0");


    document.getElementById(
        "end-min"
    ).value =
        String(
            end.getMinutes()
        ).padStart(2, "0");


    document.getElementById(
        "save-btn"
    ).innerText =
        "일정 수정하기";


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


/* 날짜 변환 */

function formatDateInput(date) {

    const year =
        date.getFullYear();

    const month =
        String(
            date.getMonth() + 1
        ).padStart(2, "0");

    const day =
        String(
            date.getDate()
        ).padStart(2, "0");

    return `${year}-${month}-${day}`;

}


/* 중복 예약 검사 */

function hasReservationConflict(
    start,
    end,
    ignoreId = null
) {

    const events =
        calendar.getEvents();


    const newStart =
        new Date(start);

    const newEnd =
        new Date(end);


    return events.some(
        event => {

            /* 수정 중인 자기 자신 제외 */

            if (
                event.id === ignoreId
            ) {
                return false;
            }


            const eventColor =
                event.backgroundColor ||
                event.color;


            /* 빨간색 일정만 공용 공간 예약 */

            if (
                eventColor !==
                RESERVATION_COLOR
            ) {
                return false;
            }


            const existingStart =
                event.start;

            const existingEnd =
                event.end;


            return (
                newStart < existingEnd
                &&
                newEnd > existingStart
            );

        }
    );

}


/* 일정 저장 */

async function saveEvent() {

    const category =
        document.getElementById(
            "category"
        ).value;


    let title;
    let color;


    /* 구성원 출근 */

    if (
        category === "attendance"
    ) {

        const member =
            document.getElementById(
                "member"
            ).value;


        const workType =
            document.getElementById(
                "work-type"
            ).value;


        title =
            `${member} ${workType}`;


        color =
            MEMBER_COLORS[member];

    }


    /* 공용 공간 예약 */

    else {

        title =
            document.getElementById(
                "reservation-title"
            ).value
            .trim();


        if (!title) {

            alert(
                "예약명을 입력해주세요."
            );

            return;

        }


        color =
            RESERVATION_COLOR;

    }


    const start =
        `${document.getElementById("start-date").value}T${document.getElementById("start-hour").value}:${document.getElementById("start-min").value}:00`;


    /* 수정된 종료 시간 생성 */

    const end =
        `${document.getElementById("end-date").value}T${document.getElementById("end-hour").value}:${document.getElementById("end-min").value}:00`;


    /* 종료 시간이 시작 시간보다 빠르거나 같으면 차단 */

    if (
        new Date(end) <=
        new Date(start)
    ) {

        alert(
            "종료 일시는 시작 일시보다 늦어야 합니다."
        );

        return;

    }


    /* 공용 공간 예약 중복 검사 */

    if (
        category === "reservation"
    ) {

        const conflict =
            hasReservationConflict(
                start,
                end,
                editingEventId
            );


        if (conflict) {

            alert(
                "이미 해당 시간에 공용 공간 예약이 있습니다.\n다른 시간을 선택해주세요."
            );

            return;

        }

    }


    try {

        /* 수정 */

        if (
            editingEventId
        ) {

            const res =
                await fetch(
                    `${API_URL}/id/${editingEventId}`,
                    {
                        method: "PATCH",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({
                                data: {
                                    title,
                                    start,
                                    end,
                                    color
                                }
                            })

                    }
                );


            if (res.ok) {

                alert(
                    "일정이 수정되었습니다."
                );

                resetForm();

                calendar.refetchEvents();

            }

            else {

                alert(
                    "일정 수정에 실패했습니다."
                );

            }

        }


        /* 신규 등록 */

        else {

            const res =
                await fetch(
                    API_URL,
                    {

                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({

                                data: [
                                    {
                                        title,
                                        start,
                                        end,
                                        color,

                                        id:
                                            "NOQ-" +
                                            Date.now()
                                    }
                                ]

                            })

                    }
                );


            if (res.ok) {

                alert(
                    "등록되었습니다."
                );

                calendar.refetchEvents();

                calendar.gotoDate(start);

                resetForm();

            }

            else {

                alert(
                    "일정 등록에 실패했습니다."
                );

            }

        }

    }

    catch (error) {

        console.error(error);

        alert(
            "오류가 발생했습니다."
        );

    }

}


/* 삭제 */

async function deleteEventById(id) {

    try {

        const res =
            await fetch(
                `${API_URL}/id/${id}`,
                {
                    method: "DELETE"
                }
            );


        if (res.ok) {

            alert(
                "삭제되었습니다."
            );


            if (
                editingEventId === id
            ) {

                resetForm();

            }


            calendar.refetchEvents();

        }

        else {

            alert(
                "삭제에 실패했습니다."
            );

        }

    }

    catch (error) {

        console.error(error);

        alert(
            "오류가 발생했습니다."
        );

    }

}


/* 입력창 초기화 */

function resetForm() {

    editingEventId = null;


    document.getElementById(
        "category"
    ).value =
        "attendance";


    updateFormByCategory();


    document.getElementById(
        "reservation-title"
    ).value =
        "";


    const today =
        getKoreaToday();


    document.getElementById(
        "start-date"
    ).value =
        today;


    document.getElementById(
        "end-date"
    ).value =
        today;


    document.getElementById(
        "save-btn"
    ).innerText =
        "일정 등록하기";

}


/* 통계 */

function updateStats(info) {

    const events =
        info.view.calendar.getEvents();


    const stats = {};


    const statsTitle =
        document.getElementById(
            "stats-title"
        );


    const filterStart =
        info.view.activeStart;

    const filterEnd =
        info.view.activeEnd;


    if (
        info.view.type ===
        "dayGridMonth"
    ) {

        const currentMonth =
            info.view.currentStart.getMonth();

        const currentYear =
            info.view.currentStart.getFullYear();


        statsTitle.innerText =
            `${currentYear}년 ${currentMonth + 1}월 통계`;


        events.forEach(
            event => {

                if (
                    event.start.getMonth() ===
                    currentMonth

                    &&

                    event.start.getFullYear() ===
                    currentYear
                ) {

                    const color =
                        event.backgroundColor ||
                        event.color;


                    const duration =
                        (
                            event.end -
                            event.start
                        )
                        / 3600000;


                    stats[color] =
                        (
                            stats[color] || 0
                        )
                        + duration;

                }

            }
        );

    }

    else {

        statsTitle.innerText =
            "주간 통계";


        events.forEach(
            event => {

                if (
                    event.start >= filterStart
                    &&
                    event.start < filterEnd
                ) {

                    const color =
                        event.backgroundColor ||
                        event.color;


                    const duration =
                        (
                            event.end -
                            event.start
                        )
                        / 3600000;


                    stats[color] =
                        (
                            stats[color] || 0
                        )
                        + duration;

                }

            }
        );

    }


    const container =
        document.getElementById(
            "stats-content"
        );


    container.innerHTML = "";


    if (
        Object.keys(stats).length === 0
    ) {

        container.innerHTML =
            `<span style="
                color:#8e8e93;
                font-size:14px;
            ">
                기록이 없습니다.
            </span>`;

        return;

    }


    const sortedEntries =
        Object.entries(stats)
        .sort(
            (a, b) =>
                SORT_ORDER.indexOf(a[0])
                -
                SORT_ORDER.indexOf(b[0])
        );


    sortedEntries.forEach(
        ([color, hours]) => {

            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "stat-item";


            item.innerHTML =
                `<div
                    class="stat-dot"
                    style="
                        background:${color}
                    "
                ></div>

                <span>
                    ${COLOR_MAP[color] || "기타"}:
                    ${hours.toFixed(1)}h
                </span>`;


            container.appendChild(
                item
            );

        }
    );

}
